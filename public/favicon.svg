<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo verde arredondado -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#20c864"/>

  <!-- Crescente serrilhado (espessura da moeda, lado esquerdo) -->
  <path d="M 236 106 A 150 150 0 0 0 236 406 L 276 406 A 150 150 0 0 1 276 106 Z" fill="#0d120e"/>
  <clipPath id="crescente">
    <path d="M 236 106 A 150 150 0 0 0 236 406 L 276 406 A 150 150 0 0 1 276 106 Z"/>
  </clipPath>
  <g clip-path="url(#crescente)" fill="#20c864">
    <rect x="40" y="118" width="250" height="15"/>
    <rect x="40" y="149" width="250" height="15"/>
    <rect x="40" y="180" width="250" height="15"/>
    <rect x="40" y="211" width="250" height="15"/>
    <rect x="40" y="242" width="250" height="15"/>
    <rect x="40" y="273" width="250" height="15"/>
    <rect x="40" y="304" width="250" height="15"/>
    <rect x="40" y="335" width="250" height="15"/>
    <rect x="40" y="366" width="250" height="15"/>
  </g>

  <!-- Corpo da moeda -->
  <circle cx="276" cy="256" r="148" fill="none" stroke="#0d120e" stroke-width="26"/>

  <!-- Olho esquerdo (aberto) -->
  <ellipse cx="230" cy="224" rx="20" ry="31" fill="#0d120e"/>

  <!-- Olho direito (piscando) -->
  <path d="M 340 196 L 306 233 L 340 268" fill="none" stroke="#0d120e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sorriso -->
  <path d="M 214 298 Q 278 368 346 288" fill="none" stroke="#0d120e" stroke-width="26" stroke-linecap="round"/>
</svg>